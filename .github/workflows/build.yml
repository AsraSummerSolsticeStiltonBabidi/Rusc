name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q -o rusc-android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar
        working-directory: rusc-android
        run: gradle assembleRelease --no-daemon
      - name: Preparar APK
        run: cp rusc-android/app/build/outputs/apk/release/*.apk Rusc.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rusc-apk
          path: Rusc.apk
          if-no-files-found: error
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rusc ${{ github.run_number }}
          files: Rusc.apk
